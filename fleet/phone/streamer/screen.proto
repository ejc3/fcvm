// The part of the Android Emulator's controller service the phone streamer calls: the
// emulator's emulator_controller.proto (AOSP hardware/google/aemu,
// protos/services/emulator-controller), cut to streamScreenshot and the fields it uses. The
// package, service, method and field numbers are the emulator's, so the wire is the same;
// fields left out are skipped when a message is read.
syntax = "proto3";

package android.emulation.control;

service EmulatorController {
    rpc streamScreenshot(ImageFormat) returns (stream Image) {}
}

message ImageFormat {
    enum ImgFormat {
        PNG = 0;
        RGBA8888 = 1;
        RGB888 = 2;
    }
    ImgFormat format = 1;
    uint32 width = 3;
    uint32 height = 4;
    uint32 display = 5;
}

message Image {
    ImageFormat format = 1;
    bytes image = 4;
    uint32 seq = 5;
    uint64 timestampUs = 6;
}
