[package]
name = "fleet-minecraft"
version = "0.1.0"
edition = "2024"
description = "fcvm fleet, Minecraft mode: the program beside Pumpkin in each tile VM (bots, the world map stream, take-over) and the host-side bot load for the density bench"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: azalea needs nightly, and its dependency tree stays out of fcvm's lockfile.
[workspace]

[dependencies]
# The ejc3/azalea fork (branch fcvm-26.3) is upstream's 26.3 branch plus two fixes: the swing
# animation packet's entity id is a VarInt, and the level particles packet is read in 26.3's
# field order (particle first, a max speed per axis, a VarInt count, a randomization type).
# The swing bug is reported upstream as azalea-rs/azalea#404 and the particles bug is to be
# added there; once upstream fixes both, move back to azalea-rs/azalea.
azalea = { git = "https://github.com/ejc3/azalea", rev = "afbc06d7b026ad5964b56aae82d57df162967473", default-features = false, features = ["packet-event"] }
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rand = "0.9"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = "0.5"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
toml = "0.9"
tokio-tungstenite = "0.28"

[profile.release]
opt-level = 3

[[bin]]
name = "mctile"
path = "src/main.rs"
