[package]
name = "fleet-minecraft"
version = "0.1.0"
edition = "2024"
description = "fcvm fleet, Minecraft mode: the program beside Pumpkin in each tile VM (bots, the world map stream, take-over) and the host-side bot load for the density bench"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: azalea needs nightly, and its dependency tree stays out of fcvm's lockfile.
[workspace]

[dependencies]
azalea = { git = "https://github.com/ejc3/azalea", rev = "070ad4a4a7e321a5b98ceac1dc1d920defb5d9b2", default-features = false, features = ["packet-event"] }
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rand = "0.9"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = "0.5"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
toml = "0.9"
tokio-tungstenite = "0.28"

[profile.release]
opt-level = 3

[[bin]]
name = "mctile"
path = "src/main.rs"
