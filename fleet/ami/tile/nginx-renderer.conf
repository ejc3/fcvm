# TLS for the renderer, which serves plain HTTP on 127.0.0.1:8080 until it terminates TLS
# itself (fleet/PROTOCOL.md: "TLS comes later"). WebSocket upgrades pass through for /frames.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/fcvm-fleet/tls/fullchain.pem;
    ssl_certificate_key /etc/fcvm-fleet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
