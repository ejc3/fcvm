# TLS for the renderer, which serves plain HTTP on 127.0.0.1:8080 until it terminates TLS
# itself (fleet/PROTOCOL.md: "TLS comes later"). WebSocket upgrades pass through for /frames.
# Only the routes something outside the instance uses are passed (fleet/PROTOCOL.md, "Access"):
# /frames for viewers and aggregators, /health, /scene and /budget for the coordinator. The
# renderer's /still and /raw (debug and poster routes, which no viewer uses) and everything else
# are 404 here; fleet/ami/test_tile_nginx.py holds the list.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Per-source limits (fleet/PROTOCOL.md, "Connection limits"). The renderer behind this site sees
# every viewer as 127.0.0.1, so it cannot tell them apart and counts them only against its 512
# pending connections; this site separates them. A source is an IPv4 address, or an IPv6 /64: the
# first 8 of $binary_remote_addr's 16 bytes (an IPv4 address is 4 bytes, so the families never
# share a key). 1 MiB holds about 16 thousand sources, more than the connections nginx takes
# (Ubuntu's nginx.conf: 768 per worker).
map $binary_remote_addr $fleet_source {
    "~(?s)^(?<fleet_prefix64>.{8}).{8}\z" $fleet_prefix64;
    default $binary_remote_addr;
}
limit_conn_zone $fleet_source zone=fleet_source:1m;
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/fcvm-fleet/tls/fullchain.pem;
    ssl_certificate_key /etc/fcvm-fleet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # At most 32 requests in progress from one source, on every route (a frame socket counts for
    # as long as it streams). A page holds at most 3 sockets to one tile: its stream (one per tile
    # and URL, fleet/web/app/_wall/frames.worker.ts), the address-family probe's (one per tile,
    # fleet/web/core/net.ts) and, across a reload, the old page's stream until it closes. 32 is
    # 3 for each of about ten viewers behind one NAT address or /64, and one client then needs
    # 16 sources to hold all 512 of the renderer's pending places. One past it is closed with no
    # response (444), as the renderer closes one past its own caps, and not logged at the
    # default level (a flood would fill the error log).
    limit_conn fleet_source 32;
    limit_conn_status 444;
    limit_conn_log_level info;
    # The TLS handshake and the request header, as the renderer's own 10 s (REQUEST_WAIT_MS):
    # nginx 1.24 gives each this long (the handshake's timer is this one), where the default is
    # 60 s. The renderer is on loopback, so 5 s to connect to it is ample (default 60 s).
    client_header_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    # Here and in no location: a location that sets any header inherits none of these.
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    location = /frames {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /scene {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /budget {
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        return 404;
    }
}
