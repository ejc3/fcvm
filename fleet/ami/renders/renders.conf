# Pages mode's host image (fleet/ami/renders): the values its build, its boot units, the agent's
# unit and the flavor's check (host-check.py) share. Installed at /etc/fcvm-fleet/renders.conf.
# One KEY=value per line; a value with spaces is double-quoted. Sourced by bash and read by
# host-check.py, which accepts nothing else.

# The kernel parameters the page's recorded figures were measured on, under the repository's
# -fcvm host kernel. `make install-host-kernel` writes them to GRUB from rootfs-config.toml
# ([kernel_profiles.nested.arm64] boot_args), and test_pipeline.py fails when the two differ.
# host-check.py fails a build or a validation boot whose command line lacks one of them or
# gives any parameter the campaign's host record keeps another value.
RENDERS_BOOT_PARAMS="kvm-arm.mode=nested numa=off arm64.nv2"

# 2 MiB pages reserved at boot, before memory fragments: 34,000 pages, 66.4 GiB, as the recorded
# campaign reserved them (512 for every clone in flight or in teardown and the memory server's
# 512). Reserved by fcvm-fleet-hugepages.service through sysfs, not on the kernel command line,
# so the command line stays the reference's.
RENDERS_HUGEPAGES=34000

# The module's CPU sets and its most renders in flight per side (docs/fleet/ARCHITECTURE.md,
# "Pages mode"): the defaults of `fcvm fleet renders-bench` on a 96-CPU host, named here so the
# image says what it runs.
RENDERS_CPUS_FCVM=0-39
RENDERS_CPUS_ENGINES=40-79
RENDERS_CPUS_HARNESS=80-95
RENDERS_MAX_FCVM=40
RENDERS_MAX_ENGINES=48

# The Kitesurf commit the image builds and runs: the recorded campaign's (its summary's
# kitesurf_commit, bench/chromium/results/renders-*-summary.json; test_pipeline.py fails when the
# two differ). The other benchmark arm's bench/chromium/kitesurf_pins.sh pins its own commit for
# its sealed records; the image takes that file's toolchain (node, pnpm, Bazelisk) and this
# commit, as the campaign's host did. A change here is a change of the reference: the campaign
# is measured again.
RENDERS_KITESURF_REV=f964846eb3cf3437abe93a64cd858c0f71938200

# What the module reads and where it writes. The checkout (its bench/chromium and the replay
# corpus) is on the root volume; Kitesurf, the snapshot and the records are on the store.
RENDERS_SRC=/home/ubuntu/fcvm
RENDERS_SNAPSHOT_TAG=renders-golden
RENDERS_KITESURF=/mnt/fcvm-btrfs/kitesurf
RENDERS_DIST=/mnt/fcvm-btrfs/kitesurf/dist-default
RENDERS_OUT=/mnt/fcvm-btrfs/renders/agent
RENDERS_RUN_DIR=/run/user/1000/fcvm-renders

# The agent runs as the build user, as the recorded campaign's module did (bench/chromium/
# renders_bench.sh sets User= to the caller). The unit names the user's runtime directory by
# this uid.
RENDERS_USER=ubuntu
RENDERS_UID=1000

# The agent check's maxima (make test-fleet-renders-agent): the check proves the module starts,
# renders, applies an overlay and leaves nothing behind; the figures come from the maxima above.
RENDERS_CHECK_MAX_FCVM=8
RENDERS_CHECK_MAX_ENGINES=8
