# cargo-nextest configuration
# https://nexte.st/book/configuration.html

[store]
# Store test results for analysis
dir = "target/nextest"

# Default profile
[profile.default]
# Run tests in parallel by default
test-threads = "num-cpus"
# Timeout per test (VM tests can be slow)
slow-timeout = { period = "60s", terminate-after = 2 }
# Fail fast on first failure
fail-fast = false
# Retry flaky tests under load before failing the run. The e2e suite runs ~538 tests
# (twice in the SnapshotEnabled matrix) on contended self-hosted runners, where genuine
# load/contention flakes (snapshot-create disk contention, clone stress, orphan-zombie
# reaping) occasionally trip a single test. A short delay lets a contention spike pass.
# `final-status-level = "flaky"` still REPORTS any test that only passed on retry, so
# flakes stay visible and tracked (see #619 and the per-test flake tickets) rather than
# hidden — retries mitigate, they do not excuse leaving a flake un-root-caused.
retries = { backoff = "fixed", count = 1, delay = "5s" }
# Status level for output
status-level = "pass"
final-status-level = "flaky"
# Show output immediately (don't capture)
success-output = "immediate"
failure-output = "immediate"

# CI profile - more verbose, stricter
[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
retries = { backoff = "fixed", count = 1, delay = "5s" }
status-level = "all"
final-status-level = "all"

# Quick profile for development
[profile.quick]
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 1 }
fail-fast = true
retries = 0

# Stress tests need exclusive access (100 VMs at once, 8000 connections)
[test-groups.stress-tests]
max-threads = 1

# Hugepage tests share a finite hugepage pool (512 pages = 1GB, each VM needs 256)
[test-groups.hugepage-tests]
max-threads = 1

# Snapshot tests limited to 3 concurrent (each snapshot is ~5.6GB on disk)
[test-groups.snapshot-tests]
max-threads = 3

# Nested (NV2) tests are the heaviest in the suite: each chain is an L1 (4GB) plus an L2 VM,
# and the L2 boots a 10GB disk copy INSIDE the L1 where there is no reflink. They run only on
# arm64 (FEAT_NV2). Run as a whole and serialized they were the CI long pole (~21 min/run,
# ~54% of the arm64 SnapshotEnabled job's wall time and the reason arm64 CI ≈ 2x x64) — which
# is why CI now runs only a representative subset (see the CI_NESTED_FILTER block in the
# Makefile). This group config still governs whatever nested tests DO run (CI subset or the
# full set locally): they run one at a time.
#
# Serialized (max-threads=1) ON PURPOSE — and it must stay that way. TWO independent reasons,
# both measured (PR #677), not assumed:
#
# 1. Cross-VM image-cache race (now FIXED, kept defensively): nested tests `--map` the host
#    /mnt/fcvm-btrfs into every L1, so two L1s preparing the same content-addressed image
#    collided on the shared "<digest>.storage-v2.img.tmp" — concurrent mkfs/resize2fs
#    CORRUPTED the image (e2fsck on the cached file showed "Filesystem still has errors") and
#    one builder's rename ENOENT'd the other's temp. The per-digest flock did not help: it is
#    flock() over a fuse-pipe mount that negotiates no FUSE_FLOCK_LOCKS, so each guest kernel
#    grants it locally and never forwards to the shared host backing store. Fixed by UUID-keyed
#    temps + atomic rename in src/commands/podman/{image.rs,mod.rs}.
#
# 2. Nested VMs do NOT parallelize — concurrency makes them SLOWER, not faster. Measured: two
#    nested tests cold-cache concurrent = 1085s wall AND a flake (test_nested_l2_network_nfs's
#    L2 ingress iperf3 starved and blew its internal 840s budget, killed at 852s); the SAME
#    test alone = 227s. A ~3.7x slowdown from 2-way contention alone (no other suite load).
#    Mechanism: every nested guest-exit issues a system-wide dsb(sy) (the #630 cache-coherency
#    patch) + raw NV2 overhead, so concurrent chains stall each other globally. De-serializing
#    therefore widens the tail and adds retries — the long pole must be cut a different way
#    (fewer/faster nested tests), not with concurrency.
[test-groups.nested-tests]
max-threads = 1

# VM tests run at full parallelism (num-cpus)
[test-groups.vm-tests]
max-threads = "num-cpus"

# The 8000-connection egress bench saturates the host (conntrack, ephemeral
# ports, CPU for every pasta process); heavy clone tests sharing its window
# flake on try 1 (the #663 gate rounds: extra_disk_ro_clone and a rotating
# stress_100 variant, each burning 100-150s before a clean retry). Give the
# bench the entire runner: ~160s of exclusivity is cheaper in wall time than
# the try-1 burns plus retries it causes.
# Seeded lifecycle chaos fuzz (make fuzz, tests/test_fuzz_chaos.rs): ONE test
# loops over every requested seed, each booting a VM and running a full op
# schedule (~2-4 min/seed). The weekly CI run uses 20 seeds x 25 ops, so the
# single test needs a multi-hour ceiling; the default run (1 seed, 10 ops)
# finishes in ~2-3 min. Listed before the vm-tests override so it wins.
[[profile.default.overrides]]
filter = "package(fcvm) & test(=test_fuzz_lifecycle_chaos)"
test-group = "vm-tests"
slow-timeout = { period = "7200s", terminate-after = 1 }
# NEVER retry the chaos fuzzer: its interleavings are seed-scheduled but not
# cycle-deterministic, so a wholesale retry would almost always pass and turn a
# caught race into a green job with only a "flaky" footnote — exactly the hedge
# this suite exists to eliminate. A chaos failure must fail the run.
retries = 0

[[profile.default.overrides]]
filter = "package(fcvm) & test(/8000_concurrent/)"
test-group = "stress-tests"
threads-required = "num-test-threads"
slow-timeout = { period = "600s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(fcvm) & test(/stress_100/)"
test-group = "stress-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# Nested (NV2) tests: serialized (see group comment) + 20-minute budget. An L1+L2 chain takes
# ~3-6 minutes end to end; the budget leaves room for the in-test
# 'timeout -k 10 840' around the L1 pipeline (which starts AFTER the
# image build/export prep) to always fire-and-clean-up BEFORE nextest's
# kill — a nextest kill orphans the sudo'd VM pipeline. Must be listed
# BEFORE the snapshot/vm-tests overrides so it wins for test names that
# also match those filters.
[[profile.default.overrides]]
filter = "package(fcvm) & (test(/nested/) | test(/podman_load_over_fuse/))"
test-group = "nested-tests"
slow-timeout = { period = "1200s", terminate-after = 1 }

# Hugepage tests must run sequentially (shared hugepage pool: 512 pages, each VM needs 256)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/hugepage/)"
test-group = "hugepage-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# Snapshot tests: limited to 3 concurrent (each creates ~5.6GB snapshot on disk)
[[profile.default.overrides]]
filter = "package(fcvm) & (test(/snapshot/) | test(/clone/))"
test-group = "snapshot-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# VM tests get 10 minute timeout (non-snapshot tests)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/test_/) & !test(/stress_100/) & !test(/pjdfstest_vm/) & !test(/snapshot/) & !test(/clone/)"
test-group = "vm-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# In-VM pjdfstest needs 15 minutes (image import via FUSE over vsock is slow)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/pjdfstest_vm/)"
test-group = "vm-tests"
slow-timeout = { period = "900s", terminate-after = 1 }

# fuse-pipe tests can run with full parallelism
[[profile.default.overrides]]
filter = "package(fuse-pipe)"
test-group = "@global"
slow-timeout = { period = "120s", terminate-after = 1 }

# fc-mock profile: container mode (no KVM required)
# Uses fc-mock binary instead of Firecracker. Only runs tests
# known to work without a real VM.
[profile.fc-mock]
test-threads = 1  # avoid container name conflicts (fcvm-container)
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
retries = { backoff = "fixed", count = 1, delay = "5s" }
status-level = "pass"
final-status-level = "flaky"
success-output = "immediate"
failure-output = "immediate"

