# cargo-nextest configuration
# https://nexte.st/book/configuration.html

[store]
# Store test results for analysis
dir = "target/nextest"

# Default profile
[profile.default]
# Run tests in parallel by default
test-threads = "num-cpus"
# Timeout per test (VM tests can be slow)
slow-timeout = { period = "60s", terminate-after = 2 }
# Fail fast on first failure
fail-fast = false
# Retry flaky tests once
retries = 0
# Status level for output
status-level = "pass"
final-status-level = "flaky"
# Show output immediately (don't capture)
success-output = "immediate"
failure-output = "immediate"

# CI profile - more verbose, stricter
[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
retries = 0
status-level = "all"
final-status-level = "all"

# Quick profile for development
[profile.quick]
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 1 }
fail-fast = true
retries = 0

# Stress tests need exclusive access (100 VMs at once, 8000 connections)
[test-groups.stress-tests]
max-threads = 1

# Hugepage tests share a finite hugepage pool (512 pages = 1GB, each VM needs 256)
[test-groups.hugepage-tests]
max-threads = 1

# Snapshot tests limited to 2 concurrent (each snapshot is ~5.6GB on disk).
# Snapshot creation is disk-I/O heavy; on the SnapshotEnabled CI jobs three
# concurrent 5.6GB writes plus full-parallelism VM tests saturated the runner
# and starved whole-lifecycle tests (test_ficlone, test_custom_command) past
# their timeouts. Capped to 2 to cut the peak snapshot I/O.
[test-groups.snapshot-tests]
max-threads = 2

# VM tests are capped well below num-cpus: each test boots a full microVM
# (real vCPU + RAM + disk), so on the metal runners (num-cpus up to 64) running
# that many VMs at once oversubscribes the box and the lifecycle tests time out.
# 8 concurrent VM boots keeps the runner from saturating while staying parallel.
[test-groups.vm-tests]
max-threads = 8

[[profile.default.overrides]]
filter = "package(fcvm) & (test(/stress_100/) | test(/8000_concurrent/))"
test-group = "stress-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# Hugepage tests must run sequentially (shared hugepage pool: 512 pages, each VM needs 256)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/hugepage/)"
test-group = "hugepage-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# Snapshot tests: limited to 2 concurrent (each creates ~5.6GB snapshot on disk)
[[profile.default.overrides]]
filter = "package(fcvm) & (test(/snapshot/) | test(/clone/))"
test-group = "snapshot-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# VM tests get 10 minute timeout (non-snapshot tests)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/test_/) & !test(/stress_100/) & !test(/pjdfstest_vm/) & !test(/snapshot/) & !test(/clone/)"
test-group = "vm-tests"
slow-timeout = { period = "600s", terminate-after = 1 }

# In-VM pjdfstest needs 15 minutes (image import via FUSE over vsock is slow)
[[profile.default.overrides]]
filter = "package(fcvm) & test(/pjdfstest_vm/)"
test-group = "vm-tests"
slow-timeout = { period = "900s", terminate-after = 1 }

# fuse-pipe tests can run with full parallelism
[[profile.default.overrides]]
filter = "package(fuse-pipe)"
test-group = "@global"
slow-timeout = { period = "120s", terminate-after = 1 }

# fc-mock profile: container mode (no KVM required)
# Uses fc-mock binary instead of Firecracker. Only runs tests
# known to work without a real VM.
[profile.fc-mock]
test-threads = 1  # avoid container name conflicts (fcvm-container)
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
retries = 0
status-level = "pass"
final-status-level = "flaky"
success-output = "immediate"
failure-output = "immediate"

