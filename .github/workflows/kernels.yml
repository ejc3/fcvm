name: Build Kernels

on:
  push:
    paths:
      - 'kernel/**'
      # The release tag/filename are derived from rootfs-config.toml (kernel_version,
      # build_inputs), so config-only changes must also trigger a rebuild.
      - 'rootfs-config.toml'
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false

# Cancel in-progress runs when a new revision is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUSE_BACKEND_RS: ${{ github.workspace }}/fuse-backend-rs
  FUSER: ${{ github.workspace }}/fuser

jobs:
  build-default-kernel:
    name: Build Default Kernel (${{ matrix.config_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - config_arch: arm64
            runner_arch: ARM64
          - config_arch: amd64
            runner_arch: X64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    # Longest successful job in the last 30 runs: 10.6 min. 60 is over 5x that; GitHub's default is six hours.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}

      - uses: actions/checkout@v7
        with:
          path: fcvm
          # This job holds `contents: write` and then runs checkout-controlled
          # `make build` plus Rust build scripts. Persisting the token in
          # fcvm/.git/config would put a write-capable credential where any of
          # that code can read it; the release steps scope GH_TOKEN themselves.
          persist-credentials: false

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          ./fcvm/scripts/ci-apt-get.sh update
          ./fcvm/scripts/ci-apt-get.sh install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libseccomp-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build

      - name: Compute and verify release identity
        id: kernel
        working-directory: fcvm
        env:
          CONFIG_ARCH: ${{ matrix.config_arch }}
        run: |
          # One script derives the version, SHA, tag and file name for every job
          # here, the way `fcvm setup` derives what it downloads. It checks
          # kernel_sha and the runner's architecture, and prints nothing unless
          # all of it holds, so a failure stops the job here.
          IDENTITY=$(python3 scripts/kernel-release-identity.py default "$CONFIG_ARCH")
          printf '%s\n' "$IDENTITY" | tee -a "$GITHUB_OUTPUT"

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            ./fcvm/scripts/ci-apt-get.sh update
            ./fcvm/scripts/ci-apt-get.sh install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Build kernel using fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          # A forced rebuild has to discard the cached content-addressed file, or
          # `fcvm setup` returns immediately and the release step republishes the very
          # artifact the operator asked to replace. The Make target owns that, along
          # with btrfs setup and config synchronisation.
          KERNEL_FILE: ${{ steps.kernel.outputs.filename }}
          FORCE: ${{ inputs.force_build == true && '1' || '0' }}
        run: |
          make release-default-kernel

          KERNEL_PATH="/tmp/${{ steps.kernel.outputs.filename }}"
          cp "/mnt/fcvm-btrfs/kernels/${{ steps.kernel.outputs.filename }}" "$KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          file "$KERNEL_PATH"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          FILENAME="${{ steps.kernel.outputs.filename }}"
          VERSION="${{ steps.kernel.outputs.version }}"
          SHA="${{ steps.kernel.outputs.sha }}"
          ARCH="${{ steps.kernel.outputs.arch }}"

          if [ "${{ inputs.force_build }}" == "true" ] && [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            --title "Default Kernel ${VERSION} (${ARCH}) - ${SHA}" \
            --notes "Default fcvm guest kernel with FUSE and snapshot-safe selective socket cleanup support.

          Required snapshot options: CONFIG_INET_DIAG=y, CONFIG_INET_DIAG_DESTROY=y, CONFIG_PACKET=y.
          The Firecracker base config is pinned by the hashed build recipe." \
            "/tmp/$FILENAME"

      - name: Summary
        run: |
          echo "### Default Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.kernel.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ steps.kernel.outputs.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | ${{ steps.kernel.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.kernel.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Existed | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY

  build-nested-kernel:
    name: Build Nested Kernel (${{ matrix.config_arch }})
    # One leg per architecture table the nested profile defines in
    # rootfs-config.toml, for the reason given on build-btrfs-kernel: setup
    # downloads the release named for the host it runs on, and
    # kernel_profiles.nested.amd64 names a kernel_repo.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config_arch: arm64
            runner_arch: ARM64
          - config_arch: amd64
            runner_arch: X64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    # Longest successful job in the last 30 runs: 10.6 min. 60 is over 5x that; GitHub's default is six hours.
    timeout-minutes: 60
    permissions:
      contents: write  # Required for creating releases
    steps:
      # This workflow shares a persistent runner workspace with ci.yml, whose
      # privileged tests leave root-owned files behind (artifacts/fc-agent and
      # friends). checkout's `git clean -ffdx` then hits "Permission denied",
      # and its "recreate the repository" fallback fails with EACCES, so the
      # job dies before compiling anything. ci.yml guards all three of its
      # self-hosted jobs exactly this way; this workflow never got the guard,
      # and every Build Kernels run since 2026-06-09 failed here.
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          path: fcvm
          # This job holds `contents: write` and then runs checkout-controlled
          # `make build` plus Rust build scripts. Persisting the token in
          # fcvm/.git/config would put a write-capable credential where any of
          # that code can read it; the release steps scope GH_TOKEN themselves.
          persist-credentials: false

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          ./fcvm/scripts/ci-apt-get.sh update
          ./fcvm/scripts/ci-apt-get.sh install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libseccomp-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build-host-tools
          # Sync the checkout's embedded config to the runner user's config dir so the
          # kernel build below uses this checkout, not stale per-runner state.
          ./target/release/fcvm setup --generate-config --force

      - name: Compute and verify release identity
        id: kernel
        working-directory: fcvm
        env:
          CONFIG_ARCH: ${{ matrix.config_arch }}
        run: |
          # The shared identity script; see build-default-kernel.
          IDENTITY=$(python3 scripts/kernel-release-identity.py nested "$CONFIG_ARCH")
          printf '%s\n' "$IDENTITY" | tee -a "$GITHUB_OUTPUT"

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            ./fcvm/scripts/ci-apt-get.sh update
            ./fcvm/scripts/ci-apt-get.sh install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # This step has no working-directory, and every checkout lands in a
          # subdirectory (path: fcvm), so the default cwd is not a git repo and
          # `gh` cannot infer the repository. GH_REPO makes it explicit rather
          # than cwd-dependent.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          # Distinguish "the release does not exist" from "the query failed".
          # The old code was `gh release view "$TAG" &>/dev/null` with the failure
          # falling into the else branch, so a gh error that had nothing to do
          # with existence was reported as "does not exist". The build then ran
          # to completion and died at the release step with
          #   a release with the same tag name already exists: <tag>
          # which is how Build Kernels failed on 2026-06-14 and 2026-08-07.
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Setup btrfs for fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        run: |
          # Create btrfs filesystem if needed
          if [ ! -d /mnt/fcvm-btrfs ]; then
            sudo mkdir -p /mnt/fcvm-btrfs
            sudo truncate -s 50G /var/fcvm-btrfs.img
            sudo mkfs.btrfs /var/fcvm-btrfs.img
            sudo mount /var/fcvm-btrfs.img /mnt/fcvm-btrfs
          fi
          sudo chown $USER:$USER /mnt/fcvm-btrfs
          # Heal root-owned store entries (see the script header for why)
          ./fcvm/scripts/normalize-store-ownership.sh /mnt/fcvm-btrfs

      - name: Build kernel using fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          # A forced rebuild must skip the release download. --build-kernels
          # builds only after a download fails, and the release being replaced
          # is still published, so setup would fetch that artifact and the
          # release step would upload the same bytes again.
          # --force-build-kernels rebuilds the profile kernel from source.
          # --build-kernels stays because setup fetches the default kernel
          # first and has to build it when that release is absent.
          if [ "$FORCE_BUILD" = "true" ]; then
            sudo ./target/release/fcvm setup --kernel-profile nested --build-kernels --force-build-kernels
          else
            sudo ./target/release/fcvm setup --kernel-profile nested --build-kernels
          fi

          # The built kernel must match the exact version/arch/SHA we publish under
          KERNEL_PATH="/tmp/${{ steps.kernel.outputs.filename }}"
          BUILT_KERNEL="/mnt/fcvm-btrfs/kernels/${{ steps.kernel.outputs.filename }}"

          if [ ! -f "$BUILT_KERNEL" ]; then
            echo "ERROR: Built kernel not found at $BUILT_KERNEL"
            ls -la /mnt/fcvm-btrfs/kernels/ || true
            exit 1
          fi

          cp "$BUILT_KERNEL" "$KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          file "$KERNEL_PATH"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_ARCH: ${{ matrix.config_arch }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          FILENAME="${{ steps.kernel.outputs.filename }}"
          VERSION="${{ steps.kernel.outputs.version }}"
          SHA="${{ steps.kernel.outputs.sha }}"
          ARCH="${{ steps.kernel.outputs.arch }}"

          # The legs nest by different mechanisms (FEAT_NV2 on arm64, VT-x or
          # AMD-V on x86_64), so each publishes notes that are true for it.
          # This runs before the delete below, so an architecture with no notes
          # fails while its published release still exists.
          case "$CONFIG_ARCH" in
            arm64)
              NOTES="Nested kernel for running fcvm inside fcvm (nested virtualization).

          ## Kernel Details

          | Property | Value |
          |----------|-------|
          | Version | ${VERSION} |
          | Build SHA | ${SHA} |
          | Architecture | ${ARCH} |

          ## Features

          - **CONFIG_KVM=y** - KVM hypervisor built-in for nested virtualization
          - **FUSE support** - For volume mounts between host and guest
          - **MMFR4 override patch** - Enables \`arm64.nv2\` boot parameter for NV2 support

          ## ARM64 Nested Virtualization (EL2)

          This kernel enables recursive VM nesting on ARM64 using FEAT_NV2:

          - **EL2** - ARM Exception Level 2 (hypervisor mode), required for KVM
          - **VHE mode** - Virtualization Host Extensions for efficient hypervisor
          - **NV2** - Nested Virtualization v2, allows guest kernels to run their own KVM

          ## Requirements

          - **Host**: ARM64 with FEAT_NV2 (AWS Graviton3+: c7g.metal, m7g.metal)
          - **Host kernel**: 6.18+ with \`kvm-arm.mode=nested\` boot parameter

          ## Usage

          \`\`\`bash
          fcvm setup --kernel-profile nested
          fcvm podman run --kernel-profile nested --privileged --name outer alpine:latest
          # Inside VM: fcvm podman run --name inner alpine:latest
          \`\`\`
          "
              ;;
            amd64)
              NOTES="Nested kernel for running fcvm inside fcvm (nested virtualization).

          ## Kernel Details

          | Property | Value |
          |----------|-------|
          | Version | ${VERSION} |
          | Build SHA | ${SHA} |
          | Architecture | ${ARCH} |

          ## Features

          - **CONFIG_KVM=y, CONFIG_KVM_INTEL=y, CONFIG_KVM_AMD=y** - KVM hypervisor built-in for Intel VT-x and AMD-V
          - **FUSE support** - For volume mounts between host and guest
          - **FUSE remap_file_range patch** - Enables reflink/CoW through FUSE

          ## Requirements

          - **Host**: x86_64 with Intel VT-x or AMD-V (AWS: c5.metal or another bare-metal instance)
          - **Host KVM**: nested virtualization enabled (\`nested=1\` for \`kvm_intel\` or \`kvm_amd\`)

          ## Usage

          \`\`\`bash
          fcvm setup --kernel-profile nested
          fcvm podman run --kernel-profile nested --privileged --name outer alpine:latest
          # Inside VM: fcvm podman run --name inner alpine:latest
          \`\`\`
          "
              ;;
            *) echo "ERROR: unsupported config arch $CONFIG_ARCH"; exit 1 ;;
          esac

          # Delete existing release if force rebuilding
          if [ "${{ inputs.force_build }}" == "true" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
          fi

          # Create release with kernel binary
          gh release create "$TAG" \
            --title "Nested Kernel ${VERSION} (${ARCH}) - ${SHA}" \
            --notes "$NOTES" \
            "/tmp/$FILENAME"

          echo "✅ Created release: $TAG"

      - name: Summary
        run: |
          echo "### Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.kernel.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ steps.kernel.outputs.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | ${{ steps.kernel.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.kernel.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filename | ${{ steps.kernel.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Existed | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY

  build-btrfs-kernel:
    name: Build Btrfs Kernel (${{ matrix.config_arch }})
    # One leg per architecture table the btrfs profile defines in
    # rootfs-config.toml. `fcvm setup --kernel-profile btrfs` downloads the
    # release named for the host it runs on, so an architecture with a table
    # and no leg here has nothing to download: after the move to 6.18.50 an
    # x86_64 host got a 404 for kernel-btrfs-6.18.50-x86_64-<sha>.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config_arch: arm64
            runner_arch: ARM64
          - config_arch: amd64
            runner_arch: X64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    # Longest successful job in the last 30 runs: 10.6 min. 60 is over 5x that; GitHub's default is six hours.
    timeout-minutes: 60
    permissions:
      contents: write  # Required for creating releases
    steps:
      # This workflow shares a persistent runner workspace with ci.yml, whose
      # privileged tests leave root-owned files behind (artifacts/fc-agent and
      # friends). checkout's `git clean -ffdx` then hits "Permission denied",
      # and its "recreate the repository" fallback fails with EACCES, so the
      # job dies before compiling anything. ci.yml guards all three of its
      # self-hosted jobs exactly this way; this workflow never got the guard,
      # and every Build Kernels run since 2026-06-09 failed here.
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          path: fcvm
          # This job holds `contents: write` and then runs checkout-controlled
          # `make build` plus Rust build scripts. Persisting the token in
          # fcvm/.git/config would put a write-capable credential where any of
          # that code can read it; the release steps scope GH_TOKEN themselves.
          persist-credentials: false

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          ./fcvm/scripts/ci-apt-get.sh update
          ./fcvm/scripts/ci-apt-get.sh install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libseccomp-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build-host-tools
          # Sync the checkout's embedded config to the runner user's config dir so the
          # kernel build below uses this checkout, not stale per-runner state.
          ./target/release/fcvm setup --generate-config --force

      - name: Compute and verify release identity
        id: kernel
        working-directory: fcvm
        env:
          CONFIG_ARCH: ${{ matrix.config_arch }}
        run: |
          # The shared identity script; see build-default-kernel.
          IDENTITY=$(python3 scripts/kernel-release-identity.py btrfs "$CONFIG_ARCH")
          printf '%s\n' "$IDENTITY" | tee -a "$GITHUB_OUTPUT"

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            ./fcvm/scripts/ci-apt-get.sh update
            ./fcvm/scripts/ci-apt-get.sh install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # This step has no working-directory, and every checkout lands in a
          # subdirectory (path: fcvm), so the default cwd is not a git repo and
          # `gh` cannot infer the repository. GH_REPO makes it explicit rather
          # than cwd-dependent.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          # Distinguish "the release does not exist" from "the query failed".
          # The old code was `gh release view "$TAG" &>/dev/null` with the failure
          # falling into the else branch, so a gh error that had nothing to do
          # with existence was reported as "does not exist". The build then ran
          # to completion and died at the release step with
          #   a release with the same tag name already exists: <tag>
          # which is how Build Kernels failed on 2026-06-14 and 2026-08-07.
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Setup btrfs for fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        run: |
          # Create btrfs filesystem if needed
          if [ ! -d /mnt/fcvm-btrfs ]; then
            sudo mkdir -p /mnt/fcvm-btrfs
            sudo truncate -s 50G /var/fcvm-btrfs.img
            sudo mkfs.btrfs /var/fcvm-btrfs.img
            sudo mount /var/fcvm-btrfs.img /mnt/fcvm-btrfs
          fi
          sudo chown $USER:$USER /mnt/fcvm-btrfs
