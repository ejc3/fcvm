name: Build Kernels

on:
  push:
    paths:
      - 'kernel/**'
      # The release tag/filename are derived from rootfs-config.toml (kernel_version,
      # build_inputs), so config-only changes must also trigger a rebuild.
      - 'rootfs-config.toml'
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false

# Cancel in-progress runs when a new revision is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUSE_BACKEND_RS: ${{ github.workspace }}/fuse-backend-rs
  FUSER: ${{ github.workspace }}/fuser

jobs:
  build-default-kernel:
    name: Build Default Kernel (${{ matrix.config_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - config_arch: arm64
            runner_arch: ARM64
          - config_arch: amd64
            runner_arch: X64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    permissions:
      contents: write
    steps:
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}

      - uses: actions/checkout@v7
        with:
          path: fcvm

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build

      - name: Compute and verify release identity
        id: kernel
        working-directory: fcvm
        env:
          CONFIG_ARCH: ${{ matrix.config_arch }}
        run: |
          mapfile -t METADATA < <(python3 - <<'PY'
          import glob
          import hashlib
          import os
          import pathlib
          import tomllib

          config = tomllib.load(open("rootfs-config.toml", "rb"))
          profile = config["kernel_profiles"]["default"][os.environ["CONFIG_ARCH"]]
          digest = hashlib.sha256()
          for pattern in profile["build_inputs"]:
              matches = sorted(pathlib.Path(path) for path in glob.glob(pattern))
              if not matches:
                  raise SystemExit(f"build input matched no files: {pattern}")
              for path in matches:
                  if not str(path).endswith(".disabled"):
                      digest.update(path.read_bytes())
          print(profile["kernel_version"])
          print(digest.hexdigest()[:12])
          print(profile["kernel_sha"])
          PY
          )

          VERSION="${METADATA[0]}"
          SHA="${METADATA[1]}"
          MANIFEST_SHA="${METADATA[2]}"
          if [ "$SHA" != "$MANIFEST_SHA" ]; then
            echo "ERROR: kernel_sha $MANIFEST_SHA does not match build_inputs hash $SHA"
            exit 1
          fi

          ARCH=$(uname -m)
          case "$CONFIG_ARCH" in
            arm64) EXPECTED_ARCH=aarch64 ;;
            amd64) EXPECTED_ARCH=x86_64 ;;
            *) echo "ERROR: unsupported config arch $CONFIG_ARCH"; exit 1 ;;
          esac
          if [ "$ARCH" != "$EXPECTED_ARCH" ]; then
            echo "ERROR: $CONFIG_ARCH matrix entry ran on $ARCH, expected $EXPECTED_ARCH"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=kernel-default-${VERSION}-${ARCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "filename=vmlinux-default-${VERSION}-${ARCH}-${SHA}.bin" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Setup btrfs for fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        run: |
          if [ ! -d /mnt/fcvm-btrfs ]; then
            sudo mkdir -p /mnt/fcvm-btrfs
            sudo truncate -s 50G /var/fcvm-btrfs.img
            sudo mkfs.btrfs /var/fcvm-btrfs.img
            sudo mount /var/fcvm-btrfs.img /mnt/fcvm-btrfs
          fi
          sudo chown $USER:$USER /mnt/fcvm-btrfs

      - name: Build kernel using fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        run: |
          sudo ./target/release/fcvm setup --kernel-profile default --build-kernels --config "$PWD/rootfs-config.toml"

          KERNEL_PATH="/tmp/${{ steps.kernel.outputs.filename }}"
          BUILT_KERNEL="/mnt/fcvm-btrfs/kernels/${{ steps.kernel.outputs.filename }}"
          if [ ! -f "$BUILT_KERNEL" ]; then
            echo "ERROR: Built kernel not found at $BUILT_KERNEL"
            ls -la /mnt/fcvm-btrfs/kernels/
            exit 1
          fi
          cp "$BUILT_KERNEL" "$KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          file "$KERNEL_PATH"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          FILENAME="${{ steps.kernel.outputs.filename }}"
          VERSION="${{ steps.kernel.outputs.version }}"
          SHA="${{ steps.kernel.outputs.sha }}"
          ARCH="${{ steps.kernel.outputs.arch }}"

          if [ "${{ inputs.force_build }}" == "true" ] && [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            --title "Default Kernel ${VERSION} (${ARCH}) - ${SHA}" \
            --notes "Default fcvm guest kernel with FUSE and snapshot-safe selective socket cleanup support.

          Required snapshot options: CONFIG_INET_DIAG=y, CONFIG_INET_DIAG_DESTROY=y, CONFIG_PACKET=y.
          The Firecracker base config is pinned by the hashed build recipe." \
            "/tmp/$FILENAME"

      - name: Summary
        run: |
          echo "### Default Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.kernel.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ steps.kernel.outputs.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | ${{ steps.kernel.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.kernel.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Existed | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY

  build-nested-kernel:
    name: Build Nested Kernel
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: write  # Required for creating releases
    steps:
      # This workflow shares a persistent runner workspace with ci.yml, whose
      # privileged tests leave root-owned files behind (artifacts/fc-agent and
      # friends). checkout's `git clean -ffdx` then hits "Permission denied",
      # and its "recreate the repository" fallback fails with EACCES, so the
      # job dies before compiling anything. ci.yml guards all three of its
      # self-hosted jobs exactly this way; this workflow never got the guard,
      # and every Build Kernels run since 2026-06-09 failed here.
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          path: fcvm

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build-host-tools
          # Sync the checkout's embedded config to the runner user's config dir so the
          # kernel build below uses this checkout, not stale per-runner state.
          ./target/release/fcvm setup --generate-config --force

      - name: Compute kernel version and SHA
        id: kernel
        working-directory: fcvm
        run: |
          # SHA must match fcvm's content-addressed kernel naming:
          # build_inputs for kernel_profiles.nested.arm64 in rootfs-config.toml
          SHA=$(cat kernel/nested.conf kernel/patches-arm64/*.patch | sha256sum | cut -c1-12)

          # Version from the checked-out repo config (the source of truth)
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('rootfs-config.toml','rb'))['kernel_profiles']['nested']['arm64']['kernel_version'])")
          if [ -z "$VERSION" ]; then
            echo "ERROR: kernel_version not found for kernel_profiles.nested.arm64 in rootfs-config.toml"
            exit 1
          fi

          ARCH=$(uname -m)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=kernel-nested-${VERSION}-${ARCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "filename=vmlinux-nested-${VERSION}-${ARCH}-${SHA}.bin" >> $GITHUB_OUTPUT

          echo "Kernel version: $VERSION"
          echo "Architecture: $ARCH"
          echo "Build SHA: $SHA"

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # This step has no working-directory, and every checkout lands in a
          # subdirectory (path: fcvm), so the default cwd is not a git repo and
          # `gh` cannot infer the repository. GH_REPO makes it explicit rather
          # than cwd-dependent.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          # Distinguish "the release does not exist" from "the query failed".
          # The old code was `gh release view "$TAG" &>/dev/null` with the failure
          # falling into the else branch, so a gh error that had nothing to do
          # with existence was reported as "does not exist". The build then ran
          # to completion and died at the release step with
          #   a release with the same tag name already exists: <tag>
          # which is how Build Kernels failed on 2026-06-14 and 2026-08-07.
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Setup btrfs for fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        run: |
          # Create btrfs filesystem if needed
          if [ ! -d /mnt/fcvm-btrfs ]; then
            sudo mkdir -p /mnt/fcvm-btrfs
            sudo truncate -s 50G /var/fcvm-btrfs.img
            sudo mkfs.btrfs /var/fcvm-btrfs.img
            sudo mount /var/fcvm-btrfs.img /mnt/fcvm-btrfs
          fi
          sudo chown $USER:$USER /mnt/fcvm-btrfs

      - name: Build kernel using fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        run: |
          # Build the nested kernel using fcvm
          sudo ./target/release/fcvm setup --kernel-profile nested --build-kernels

          # The built kernel must match the exact version/arch/SHA we publish under
          KERNEL_PATH="/tmp/${{ steps.kernel.outputs.filename }}"
          BUILT_KERNEL="/mnt/fcvm-btrfs/kernels/${{ steps.kernel.outputs.filename }}"

          if [ ! -f "$BUILT_KERNEL" ]; then
            echo "ERROR: Built kernel not found at $BUILT_KERNEL"
            ls -la /mnt/fcvm-btrfs/kernels/ || true
            exit 1
          fi

          cp "$BUILT_KERNEL" "$KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          file "$KERNEL_PATH"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          FILENAME="${{ steps.kernel.outputs.filename }}"
          VERSION="${{ steps.kernel.outputs.version }}"
          SHA="${{ steps.kernel.outputs.sha }}"
          ARCH="${{ steps.kernel.outputs.arch }}"

          # Delete existing release if force rebuilding
          if [ "${{ inputs.force_build }}" == "true" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
          fi

          # Create release with kernel binary
          gh release create "$TAG" \
            --title "Nested Kernel ${VERSION} (${ARCH}) - ${SHA}" \
            --notes "Nested kernel for running fcvm inside fcvm (nested virtualization).

          ## Kernel Details

          | Property | Value |
          |----------|-------|
          | Version | ${VERSION} |
          | Build SHA | ${SHA} |
          | Architecture | ${ARCH} |

          ## Features

          - **CONFIG_KVM=y** - KVM hypervisor built-in for nested virtualization
          - **FUSE support** - For volume mounts between host and guest
          - **MMFR4 override patch** - Enables \`arm64.nv2\` boot parameter for NV2 support

          ## ARM64 Nested Virtualization (EL2)

          This kernel enables recursive VM nesting on ARM64 using FEAT_NV2:

          - **EL2** - ARM Exception Level 2 (hypervisor mode), required for KVM
          - **VHE mode** - Virtualization Host Extensions for efficient hypervisor
          - **NV2** - Nested Virtualization v2, allows guest kernels to run their own KVM

          ## Requirements

          - **Host**: ARM64 with FEAT_NV2 (AWS Graviton3+: c7g.metal, m7g.metal)
          - **Host kernel**: 6.18+ with \`kvm-arm.mode=nested\` boot parameter

          ## Usage

          \`\`\`bash
          fcvm setup --kernel-profile nested
          fcvm podman run --kernel-profile nested --privileged --name outer alpine:latest
          # Inside VM: fcvm podman run --name inner alpine:latest
          \`\`\`
          " \
            "/tmp/$FILENAME"

          echo "✅ Created release: $TAG"

      - name: Summary
        run: |
          echo "### Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.kernel.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ steps.kernel.outputs.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | ${{ steps.kernel.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.kernel.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filename | ${{ steps.kernel.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Existed | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY

  build-btrfs-kernel:
    name: Build Btrfs Kernel
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: write  # Required for creating releases
    steps:
      # This workflow shares a persistent runner workspace with ci.yml, whose
      # privileged tests leave root-owned files behind (artifacts/fc-agent and
      # friends). checkout's `git clean -ffdx` then hits "Permission denied",
      # and its "recreate the repository" fallback fails with EACCES, so the
      # job dies before compiling anything. ci.yml guards all three of its
      # self-hosted jobs exactly this way; this workflow never got the guard,
      # and every Build Kernels run since 2026-06-09 failed here.
      - name: Fix workspace permissions (pre-checkout)
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          path: fcvm

      - uses: ./fcvm/.github/actions/checkout-deps

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev libfuse3-dev libclang-dev clang musl-tools

      - name: Build fcvm and fc-agent
        working-directory: fcvm
        run: |
          make build-host-tools
          # Sync the checkout's embedded config to the runner user's config dir so the
          # kernel build below uses this checkout, not stale per-runner state.
          ./target/release/fcvm setup --generate-config --force

      - name: Compute kernel version and SHA
        id: kernel
        working-directory: fcvm
        run: |
          # SHA must match fcvm's content-addressed kernel naming:
          # build_inputs for kernel_profiles.btrfs.arm64 in rootfs-config.toml (no patches)
          SHA=$(cat kernel/btrfs.conf | sha256sum | cut -c1-12)

          # Version from the checked-out repo config (the source of truth)
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('rootfs-config.toml','rb'))['kernel_profiles']['btrfs']['arm64']['kernel_version'])")
          if [ -z "$VERSION" ]; then
            echo "ERROR: kernel_version not found for kernel_profiles.btrfs.arm64 in rootfs-config.toml"
            exit 1
          fi

          ARCH=$(uname -m)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=kernel-btrfs-${VERSION}-${ARCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "filename=vmlinux-btrfs-${VERSION}-${ARCH}-${SHA}.bin" >> $GITHUB_OUTPUT

          echo "Kernel version: $VERSION"
          echo "Architecture: $ARCH"
          echo "Build SHA: $SHA"

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "GitHub CLI already installed: $(gh --version)"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # This step has no working-directory, and every checkout lands in a
          # subdirectory (path: fcvm), so the default cwd is not a git repo and
          # `gh` cannot infer the repository. GH_REPO makes it explicit rather
          # than cwd-dependent.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          # Distinguish "the release does not exist" from "the query failed".
          # The old code was `gh release view "$TAG" &>/dev/null` with the failure
          # falling into the else branch, so a gh error that had nothing to do
          # with existence was reported as "does not exist". The build then ran
          # to completion and died at the release step with
          #   a release with the same tag name already exists: <tag>
          # which is how Build Kernels failed on 2026-06-14 and 2026-08-07.
          set +e
          OUT=$(gh release view "$TAG" --json tagName 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif printf '%s' "$OUT" | grep -qi 'release not found\|not found'; then
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "::error::cannot determine whether release $TAG exists (rc=$RC): $OUT"
            exit 1
          fi

      - name: Setup btrfs for fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        run: |
          # Create btrfs filesystem if needed
          if [ ! -d /mnt/fcvm-btrfs ]; then
            sudo mkdir -p /mnt/fcvm-btrfs
            sudo truncate -s 50G /var/fcvm-btrfs.img
            sudo mkfs.btrfs /var/fcvm-btrfs.img
            sudo mount /var/fcvm-btrfs.img /mnt/fcvm-btrfs
          fi
          sudo chown $USER:$USER /mnt/fcvm-btrfs

      - name: Build kernel using fcvm
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        run: |
          # Build the btrfs kernel using fcvm
          sudo ./target/release/fcvm setup --kernel-profile btrfs --build-kernels

          # The built kernel must match the exact version/arch/SHA we publish under
          KERNEL_PATH="/tmp/${{ steps.kernel.outputs.filename }}"
          BUILT_KERNEL="/mnt/fcvm-btrfs/kernels/${{ steps.kernel.outputs.filename }}"

          if [ ! -f "$BUILT_KERNEL" ]; then
            echo "ERROR: Built kernel not found at $BUILT_KERNEL"
            ls -la /mnt/fcvm-btrfs/kernels/ || true
            exit 1
          fi

          cp "$BUILT_KERNEL" "$KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          file "$KERNEL_PATH"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || inputs.force_build == true
        working-directory: fcvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.kernel.outputs.tag }}"
          FILENAME="${{ steps.kernel.outputs.filename }}"
          VERSION="${{ steps.kernel.outputs.version }}"
          SHA="${{ steps.kernel.outputs.sha }}"
          ARCH="${{ steps.kernel.outputs.arch }}"

          # Delete existing release if force rebuilding
          if [ "${{ inputs.force_build }}" == "true" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
          fi

          # Create release with kernel binary
          gh release create "$TAG" \
            --title "Btrfs Kernel ${VERSION} (${ARCH}) - ${SHA}" \
            --notes "Kernel with FUSE and btrfs support for efficient container storage.

          ## Kernel Details

          | Property | Value |
          |----------|-------|
          | Version | ${VERSION} |
          | Build SHA | ${SHA} |
          | Architecture | ${ARCH} |

          ## Features

          - **CONFIG_FUSE_FS=y** - FUSE passthrough for fuse-pipe volumes
          - **CONFIG_BTRFS_FS=y** - Btrfs filesystem for container storage
          - **FUSE remap_file_range patch** - Enables reflink/CoW through FUSE

          ## Why Btrfs?

          Avoids the overlay \`checkAndRecordIDMappedSupport\` issue in containers/storage
          that forces rootless podman through the slow \`storage-chown-by-maps\` path.
          Btrfs handles user namespaces natively without idmapped mounts.

          ## Usage

          \`\`\`bash
          fcvm setup --kernel-profile btrfs --build-kernels
          fcvm podman run --kernel-profile btrfs --name test localhost/myapp
          \`\`\`
          " \
            "/tmp/$FILENAME"

          echo "✅ Created release: $TAG"

      - name: Summary
        run: |
          echo "### Btrfs Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.kernel.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ steps.kernel.outputs.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | ${{ steps.kernel.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.kernel.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filename | ${{ steps.kernel.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Existed | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY
