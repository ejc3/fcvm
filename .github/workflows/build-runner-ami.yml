name: Build Runner AMI

on:
  workflow_run:
    workflows: ["Build Kernels"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-1

jobs:
  build-ami:
    name: Build Runner AMI
    # Publishing affects every future runner. The environment requires owner
    # approval and permits main only; ordinary collaborator CI stays ungated.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: runner-ami-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check CI security contracts without AWS credentials
        run: make test-ci-security

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::928413605543:role/github-actions-ami-builder
          aws-region: us-west-1

      - name: Build AMI
        id: build
        run: |
          chmod +x scripts/build-ami.sh
          scripts/build-ami.sh

      - name: Summary
        run: |
          if [ "${{ steps.build.outputs.cached }}" = "true" ]; then
            echo "## Runner AMI (Cached)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**AMI ID:** \`${{ steps.build.outputs.ami_id }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Runner AMI Built" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**AMI ID:** \`${{ steps.build.outputs.ami_id }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Kernel:** \`${{ steps.build.outputs.kernel_version }}-nested\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Update \`firecracker_ami\` in terraform:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`hcl" >> $GITHUB_STEP_SUMMARY
            echo "variable \"firecracker_ami\" {" >> $GITHUB_STEP_SUMMARY
            echo "  default = \"${{ steps.build.outputs.ami_id }}\"" >> $GITHUB_STEP_SUMMARY
            echo "}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
