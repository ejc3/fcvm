name: Fleet image build request

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      priority:
        description: 'Critical fixes start immediately; routine changes batch'
        type: choice
        default: normal
        options: [normal, critical]

permissions:
  contents: read

# Requests are short. AWS serializes builds and can preempt a routine build for
# a critical fix after cleaning its exact builders; no long GitHub queue hides it.
jobs:
  request:
    if: >-
      github.repository == 'ejc3/fcvm' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fleet-ami-publish
    permissions:
      contents: read
      pull-requests: read
      # request.py reads main's CI runs to skip a revision main moved past or one still in CI
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the request boundary without AWS credentials
        run: python3 -B fleet/ami/test_request.py
      # Generation twelve, the factory's first published pair, broke staging (ejc3/aws#823): its
      # host kernel loads ENA as a module after cloud-init looks for a NIC, so the host booted
      # without its user data, and the acceptance never booted the candidate through the fleet's
      # launch path. This step runs from main's copy of this file whichever revision asked, and
      # refuses a source without both fixes: ENA built into the host kernel
      # (kernel/host-x86.conf) and the launch-path acceptance (launch_path_proof in
      # fleet/ami/pipeline_guest.py).
      - name: Refuse a source without the boot fix and the launch-path acceptance
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          git show "$SOURCE_SHA:kernel/host-x86.conf" 2>/dev/null | grep -qx 'CONFIG_ENA_ETHERNET=y' \
            || { echo "::error::$SOURCE_SHA does not build ENA into the host kernel (kernel/host-x86.conf); not requested (ejc3/aws#823)"; exit 1; }
          git show "$SOURCE_SHA:fleet/ami/pipeline_guest.py" 2>/dev/null | grep -q '^def launch_path_proof(' \
            || { echo "::error::$SOURCE_SHA has no launch-path acceptance (fleet/ami/pipeline_guest.py launch_path_proof); not requested (ejc3/aws#823)"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: fleet-image-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Request the immutable main image build
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REQUEST_PRIORITY: ${{ github.event_name == 'workflow_run' && 'auto' || (github.event_name == 'workflow_dispatch' && inputs.priority || 'normal') }}
          GH_TOKEN: ${{ github.token }}
          AMI_PIPELINE_DISPATCH: ${{ secrets.AMI_PIPELINE_DISPATCH }}
        run: python3 -B fleet/ami/request.py --sha "$SOURCE_SHA" --priority "$REQUEST_PRIORITY"
