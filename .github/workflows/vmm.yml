name: VMM builds

# Builds every pinned Firecracker (for the kernel profiles whose kernels are published) and the
# pinned Cloud Hypervisor from source, once per architecture and per libc the CI lanes run on,
# publishes each binary as the asset of release vmm-<store name>, and pushes the digests to a
# vmm-digests/<commit> branch for rootfs-config.toml's [vmm_artifacts]. Setup then installs the
# published build whose name it would build, checked against that digest, instead of building
# it (src/setup/vmm_artifacts.rs). A fresh CI instance spent 169 to 190 s on the two Firecracker
# builds and 92 to 98 s on Cloud Hypervisor (runs 45967670147 and 45983151902).
#
# The builds run on GitHub-hosted runners: they need no KVM, and the job that holds
# `contents: write` then never shares an instance with a pull request's jobs (#2223).
# Rebuilding an existing release's asset is refused unless the bytes are the same.
on:
  push:
    branches: [main]
    paths: [rootfs-config.toml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vmm-builds
  cancel-in-progress: false

jobs:
  # One job per architecture, each with a GitHub-hosted runner label written out: libc "host" is
  # Ubuntu 24.04's glibc (the self-hosted Host and Host-Root lanes'), "container" the test
  # image's (the Container lanes'). scripts/vmm-build.sh does the work.
  build-x86_64:
    name: Build (x86_64, ${{ matrix.libc }} libc)
    strategy:
      fail-fast: false
      matrix:
        libc: [host, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build fcvm and the pinned VMMs
        env:
          LIBC: ${{ matrix.libc }}
        run: scripts/vmm-build.sh "$LIBC" x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmm-x86_64-${{ matrix.libc }}
          path: /out/builds
          if-no-files-found: error
          retention-days: 14

  build-aarch64:
    name: Build (aarch64, ${{ matrix.libc }} libc)
    strategy:
      fail-fast: false
      matrix:
        libc: [host, container]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build fcvm and the pinned VMMs
        env:
          LIBC: ${{ matrix.libc }}
        run: scripts/vmm-build.sh "$LIBC" aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmm-aarch64-${{ matrix.libc }}
          path: /out/builds
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish and record the digests
    needs: [build-x86_64, build-aarch64]
    # Only main's pins are published: a dispatch on another branch builds and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/builds
      - name: Publish each build as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vmm-artifacts.py publish "$RUNNER_TEMP/builds"
      - name: Push the digests to a vmm-digests branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/vmm-artifacts.py record "$RUNNER_TEMP/builds" rootfs-config.toml
          if git diff --quiet -- rootfs-config.toml; then
            echo "rootfs-config.toml already records these builds" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="vmm-digests/${SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -q -m "Record the published VMM builds of ${SHA:0:12}" -- rootfs-config.toml
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          echo "Digests on branch $branch: https://github.com/${REPO}/compare/main...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"
