name: Fleet coordinator staging deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/fleet/**'
      - 'src/cli/**'
      - 'fleet/core/**'
      - 'fleet/coord/**'
      - 'fleet/published-ports.json'
      # The build job compiles and runs this test (make test-fleet-coordinator).
      - 'tests/test_fleet_coord.rs'
      - '.github/workflows/fleet-viewer-smoke.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rootfs-config.toml'
      - '.github/workflows/fleet-coordinator-deploy.yml'
      # With the Lambda lane on, the deploy job runs these (publish.py selects the lane image).
      - 'fleet/lambda/release.py'
      - '.github/workflows/fleet-lambda-image.yml'
  # With the Lambda lane on (the repository variable FLEET_LAMBDA_LANE), a lane image main's lane workflow
  # published starts a staging release at main's head, so a push that changes only the lane image's inputs
  # reaches staging (fleet/PROTOCOL.md, "Which lane image a stack runs"). Releases are ordered where they
  # happen: publish.py, under the deploy job's fleet-viewer-smoke group, skips a commit that is an ancestor
  # of the one staging runs.
  workflow_run:
    workflows: ["Fleet Lambda lane image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run the lane build starts has a group of its own (one per lane run): GitHub keeps one pending run per
  # group and a newer one cancels it, and such a run (lane off, a failed lane run) can skip every job, so it
  # must never displace a push's pending deploy. Releases queue in the deploy job's fleet-viewer-smoke group.
  group: ${{ github.event_name == 'workflow_run' && format('fleet-coordinator-stage-lane-{0}', github.event.workflow_run.id) || 'fleet-coordinator-stage' }}
  cancel-in-progress: false

jobs:
  build:
    # A workflow_run start only for a successful push run on main of this repository, with the lane on.
    if: >-
      github.repository == 'ejc3/fcvm' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (vars.FLEET_LAMBDA_LANE == 'on' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@48b64ba94bc1a6fe819fd9afc0799a7647efdc65 # 1.93.0
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fleet-coordinator-arm64
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libclang-dev clang ffmpeg
      - name: Release and staging probe tests
        run: python3 -B fleet/coord/test_release.py
      - name: Coordinator contract tests
        run: make test-fleet-coordinator
      - name: Build the coordinator binary
        run: make build-fleet-coordinator
      - name: Build and serve the ARM64 image without credentials
        shell: bash
        run: |
          set -euo pipefail
          make -C fleet/coord image ENGINE=docker TAG="$GITHUB_SHA" IMAGE="fcvm-fleet-coordinator:$GITHUB_SHA"
          id=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:24120:8080 "fcvm-fleet-coordinator:$GITHUB_SHA")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:24120/healthz; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          # The image reports the commit it was built from (GET /version), which the smoke compares
          # with its run's commit.
          test "$(curl --fail --silent http://127.0.0.1:24120/version)" = "{\"commit\":\"$GITHUB_SHA\"}"
          docker save -o "$RUNNER_TEMP/coordinator-image.tar" "fcvm-fleet-coordinator:$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-coordinator-arm64
          path: ${{ runner.temp }}/coordinator-image.tar
          compression-level: 0
          retention-days: 1

  deploy:
    needs: build
    # A workflow_run start only for a successful push run on main of this repository, with the lane on.
    if: >-
      github.repository == 'ejc3/fcvm' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (vars.FLEET_LAMBDA_LANE == 'on' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    environment: fleet-stage-deploy
    # With the lane on, publish.py may wait up to 25 minutes for this commit's lane build.
    timeout-minutes: 75
    # The release replaces the one coordinator task, and a smoke that reads /live meanwhile
    # fails: a web deploy's IPv6 smoke got "WebSocket upgrade refused" while this job replaced
    # the task. The smokes' group (fleet-viewer-smoke.yml) holds the release until
    # a running smoke ends, and holds any smoke until the release ends. queue: max keeps a
    # pending release from being cancelled by a smoke that queues behind it.
    concurrency:
      group: fleet-viewer-smoke
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The lane pairing compares this commit with the lane build's (git merge-base, git diff).
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fleet-coordinator-arm64
          path: ${{ runner.temp }}/coordinator-image
      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/coordinator-image/coordinator-image.tar"
      # OIDC admits only this main-only environment. The role can publish this
      # image and invoke one image-only releaser; it cannot read state or call ECS.
      # The role ARN and the repository carry account ids, so they are secrets:
      # a step header prints vars.* values unmasked.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: fcvm-stage-${{ github.run_id }}
          mask-aws-account-id: true
      # Invariant 1, decided before any release call: with the lane on, a commit that is a strict ancestor
      # of one staging runs is not released. The release step below then concludes "skipped", which prod's
      # release discovery (fleet/coord/prod_release.py released) does not take for what staging runs.
      - name: Order the release (an ancestor of what staging runs is skipped)
        id: order
        env:
          COORDINATOR_RELEASE: ${{ vars.COORDINATOR_RELEASE }}
          FLEET_LAMBDA_LANE: ${{ vars.FLEET_LAMBDA_LANE }}
        run: python3 -B fleet/coord/publish.py --order
      - name: Publish and release the staging coordinator
        if: steps.order.outputs.skip == 'false'
        # FLEET_LAMBDA_LANE (a repository variable) on: the release also selects the lane build paired
        # with this commit for staging and passes it to the release function (fleet/coord/publish.py).
        # Unset: as before.
        env:
          COORDINATOR_REPO: ${{ secrets.COORDINATOR_REPO }}
          COORDINATOR_RELEASE: ${{ vars.COORDINATOR_RELEASE }}
          FLEET_LAMBDA_LANE: ${{ vars.FLEET_LAMBDA_LANE }}
          LAMBDA_TILE_REPO: ${{ secrets.LAMBDA_TILE_REPO }}
        run: python3 -B fleet/coord/publish.py

  # The viewer-path smoke against the new coordinator: every mode's tiles from an IPv4-only
  # viewer and an IPv6 one, the relaunch and fresh launch names. A failure fails this run and
  # opens or updates the fleet-viewer-smoke issue.
  smoke:
    needs: deploy
    if: github.repository == 'ejc3/fcvm' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fleet-viewer-smoke.yml
    with:
      # The smoke follows this run's release: it says so when it tests another commit.
      released: true
    # The smoke's jobs read the Access token from the fleet-stage-deploy environment; a called
    # workflow sees secrets only when its caller passes them.
    secrets: inherit
