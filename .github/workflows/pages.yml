name: Deploy design docs to GitHub Pages

# Publishes the hand-authored HTML under docs/ to GitHub Pages, plus the
# benchmark report, which bench/chromium/report/wrap_page.py wraps into a
# complete document from its fragment source at deploy time (one copy).
# Trigger is push-to-main (trusted context) or manual dispatch, never untrusted
# PR code, so no secrets are exposed to fork content.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'bench/chromium/report/shared-nothing-renders.html'
      - 'bench/chromium/report/wrap_page.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Nothing by default; each job asks for what it needs (#1014).
permissions: {}

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs repository code (wrap_page.py), so it holds no deploy permission.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r docs _site
          python3 bench/chromium/report/wrap_page.py \
            bench/chromium/report/shared-nothing-renders.html \
            > _site/shared-nothing-renders.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  # Holds the Pages and OIDC permissions and runs no repository code. Only a
  # run on main deploys; a manual dispatch from another branch stops after build.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
