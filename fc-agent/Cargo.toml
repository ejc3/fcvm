[package]
name = "fc-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "signal", "sync", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json"] }
libc = "0.2"
nix = { version = "0.29", features = ["socket", "poll", "fs"] }
fs2 = "0.4"
dashmap = "6"
fuse-pipe = { path = "../fuse-pipe", default-features = false }
exec-proto = { path = "../exec-proto" }
failpoint = { path = "../failpoint" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
