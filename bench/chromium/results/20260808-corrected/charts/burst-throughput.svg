<svg xmlns="http://www.w3.org/2000/svg" width="900" height="418" viewBox="0 0 900 418" role="img" aria-label="Burst throughput — the BURST is the experimental unit">
<style>
  .s{fill:var(--surface)} .ink{fill:var(--ink)} .ink2{fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1}
  .ax{stroke:var(--ink2);stroke-width:1}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:15px;font-weight:600} .st{font-size:11.5px}
  .lbl{font-size:11px} .val{font-size:11px;font-weight:600}
  .whisk{stroke:var(--ink);stroke-width:1.5;opacity:.75}
  svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2df}
  svg{--c0:#2a78d6}
  svg{--c1:#eb6834}
  svg{--c2:#1baf7a}
  svg{--c3:#eda100}
  svg{--c4:#e87ba4}
  svg{--c5:#008300}
  svg{--c6:#4a3aa7}
  svg{--neutral:#6e6d67;--neutral-ink:#ffffff}

  @media (prefers-color-scheme:dark){svg:where(:not([data-theme="light"])){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#333331;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--neutral:#a4a39b;--neutral-ink:#0b0b0b;}}
  svg[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#333331;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--neutral:#a4a39b;--neutral-ink:#0b0b0b;}
</style>
<rect class="s" width="900" height="418"/>
<text class="t ink" x="16" y="26">Burst throughput — the BURST is the experimental unit</text>
<text class="st ink2" x="16" y="44">median over repeated bursts per cell; whisker = 95% bootstrap CI</text>
