<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" role="img" aria-label="Shared-nothing Chromium render — where a request's wall time goes">
<style>
  .s{fill:var(--surface)} .ink{fill:var(--ink)} .ink2{fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1}
  .ax{stroke:var(--ink2);stroke-width:1}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:15px;font-weight:600} .st{font-size:11.5px}
  .lbl{font-size:11px} .val{font-size:11px;font-weight:600}
  .whisk{stroke:var(--ink);stroke-width:1.5;opacity:.75}
  svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2df}
  svg{--c0:#2a78d6}
  svg{--c1:#eb6834}
  svg{--c2:#1baf7a}
  svg{--c3:#eda100}
  svg{--c4:#e87ba4}
  svg{--c5:#008300}
  svg{--c6:#4a3aa7}
  svg{--neutral:#6e6d67;--neutral-ink:#ffffff}

  @media (prefers-color-scheme:dark){svg:where(:not([data-theme="light"])){--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#333331;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--neutral:#a4a39b;--neutral-ink:#0b0b0b;}}
  svg[data-theme="dark"]{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#333331;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--neutral:#a4a39b;--neutral-ink:#0b0b0b;}
</style>
<rect class="s" width="900" height="232"/>
<text class="t ink" x="16" y="26">Shared-nothing Chromium render — where a request's wall time goes</text>
<text class="st ink2" x="16" y="44">rootless-proxy / uffd-4k / medium page, n=12 requests; stage medians (they sum to slightly less than the total: each is its own median)</text>
<rect x="16.0" y="74" width="52.6" height="46" rx="4" fill="var(--c0)"/>
<text class="val" x="42.3" y="101" text-anchor="middle" fill="#fff">53</text>
<rect x="70.6" y="74" width="26.9" height="46" rx="4" fill="var(--c6)"/>
<rect x="99.6" y="74" width="229.9" height="46" rx="4" fill="var(--c1)"/>
<text class="val" x="214.5" y="101" text-anchor="middle" fill="#fff">224</text>
<rect x="331.5" y="74" width="1.6" height="46" rx="4" fill="var(--c3)"/>
<rect x="335.1" y="74" width="15.3" height="46" rx="4" fill="var(--c5)"/>
<rect x="352.3" y="74" width="208.7" height="46" rx="4" fill="var(--c2)"/>
<text class="val" x="456.7" y="101" text-anchor="middle" fill="#fff">204</text>
<rect x="563.1" y="74" width="138.1" height="46" rx="4" fill="var(--c4)"/>
<text class="val" x="632.1" y="101" text-anchor="middle" fill="#fff">136</text>
<rect x="703.1" y="74" width="178.9" height="46" rx="4" fill="var(--neutral)"/>
<text class="val" x="792.6" y="101" text-anchor="middle" fill="var(--neutral-ink)">175</text>
<text class="lbl ink2" x="16" y="138">0 ms</text>
<text class="val ink" x="884" y="138" text-anchor="end">artifact 730 ms · total 891 ms</text>
<rect x="16.0" y="153" width="10" height="10" rx="2" fill="var(--c0)"/>
<text class="lbl ink" x="32.0" y="162">restore (clone) — 53 ms</text>
<rect x="305.3333333333333" y="153" width="10" height="10" rx="2" fill="var(--c6)"/>
<text class="lbl ink" x="321.3333333333333" y="162">fcvm exec handshake — 28 ms</text>
<rect x="594.6666666666666" y="153" width="10" height="10" rx="2" fill="var(--c1)"/>
<text class="lbl ink" x="610.6666666666666" y="162">guest command start — 224 ms</text>
<rect x="16.0" y="175" width="10" height="10" rx="2" fill="var(--c3)"/>
<text class="lbl ink" x="32.0" y="184">first egress — 4 ms</text>
<rect x="305.3333333333333" y="175" width="10" height="10" rx="2" fill="var(--c5)"/>
<text class="lbl ink" x="321.3333333333333" y="184">CDP handshake — 17 ms</text>
<rect x="594.6666666666666" y="175" width="10" height="10" rx="2" fill="var(--c2)"/>
<text class="lbl ink" x="610.6666666666666" y="184">page load — 204 ms</text>
<rect x="16.0" y="197" width="10" height="10" rx="2" fill="var(--c4)"/>
<text class="lbl ink" x="32.0" y="206">screenshot + DOM (JPEG q80) — 136 ms</text>
<rect x="305.3333333333333" y="197" width="10" height="10" rx="2" fill="var(--neutral)"/>
<text class="lbl ink" x="321.3333333333333" y="206">teardown (post-artifact) — 175 ms</text>
</svg>