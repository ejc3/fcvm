[package]
name = "failpoint"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Deterministic failpoints for lifecycle interleaving tests (FCVM_FAILPOINT / FCVM_GUEST_FAILPOINT)"

[dependencies]
tokio = { version = "1", features = ["time", "fs"] }
# The `burn` guest action: per-thread scheduling syscalls, CPU pinning, and the debugfs mount
# that reaches the fair server.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
