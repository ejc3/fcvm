name = "WakeVerify"
defaultTargets = ["WakeVerify", "breaks", "hostops", "GateVerify", "gate-breaks", "gate-seq", "ResumeVerify", "resume-breaks"]

# A warning fails the build: `sorry` is a warning, and so is a `#guard_msgs` that Lean could
# only partly check.
leanOptions = { warningAsError = true }

# The guest vCPU wake-up path (namespace `Wake`). `globs` builds every file of the directory,
# imported by the root or not, so no file escapes the build or the axiom sweep.
[[lean_lib]]
name = "WakeVerify"
globs = ["WakeVerify.*"]

# `lake exe breaks`: the exhaustive search of every rule book for lost wake-ups.
[[lean_exe]]
name = "breaks"
root = "Search"

# `lake exe hostops <kernel>`: the model's kernel rules as operations and expected states, for
# the C harness that drives the kernel's own functions (harness/run.sh).
[[lean_exe]]
name = "hostops"
root = "HostOps"

# The snapshot and restore network boundary (namespace `Gate`).
[[lean_lib]]
name = "GateVerify"
globs = ["GateVerify.*"]

# `lake exe gate-breaks`: the exhaustive search of every rule book of the boundary.
[[lean_exe]]
name = "gate-breaks"
root = "GateSearch"

# `lake exe gate-seq`: each rule book's boundary sequence, in the names fc-agent's own model
# tests log, for gate-drift.sh to compare with the Rust source.
[[lean_exe]]
name = "gate-seq"
root = "GateSeq"

# A vCPU's timer and interrupt state across a snapshot and a restore on arm64 (namespace
# `Resume`).
[[lean_lib]]
name = "ResumeVerify"
globs = ["ResumeVerify.*"]

# `lake exe resume-breaks`: the exhaustive search of every rule book of that model.
[[lean_exe]]
name = "resume-breaks"
root = "ResumeSearch"
