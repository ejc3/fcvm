# fcvm btrfs kernel config fragment
#
# This fragment is applied on top of Firecracker's microvm kernel config.

# FUSE support for passthrough filesystem
CONFIG_FUSE_FS=y

# btrfs filesystem with POSIX ACL support (container tools need file ACLs)
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y

# Snapshot restore selectively destroys only sockets captured before cleanup.
# SOCK_DESTROY is required; a global conntrack flush can delete live DNAT flows.
CONFIG_INET_DIAG=y
CONFIG_INET_DIAG_DESTROY=y
CONFIG_PACKET=y

# The snapshot boundary installs a directional NEW-flow REJECT gate with
# iptables and ip6tables before capturing socket cookies. The guest's iptables
# is the nft backend (Ubuntu 24.04), which creates its tables dynamically in
# nftables and reaches the xt REJECT target and conntrack match through
# NFT_COMPAT; the legacy filter tables sit behind NETFILTER_XTABLES_LEGACY on
# 6.18 and are not used. Declaring the options the gate executes makes the
# kernel build verify them: the generated build script fails when Kconfig
# drops a requested =y, so a base-config change cannot silently leave the gate
# unable to install.
CONFIG_NETFILTER_XTABLES=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_COMPAT=y
CONFIG_NF_CONNTRACK=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_TARGET_REJECT=y
