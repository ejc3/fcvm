# fcvm btrfs kernel config fragment (x86_64)
#
# This fragment is applied on top of Firecracker's microvm kernel config.
# x86-specific: includes PCI/MMIO configs needed for Firecracker's IRQ infrastructure.

# PCI support (required for GENERIC_MSI_IRQ which virtio needs for IRQ handling)
# Even though Firecracker uses virtio-mmio, the IRQ infrastructure needs PCI_MSI
CONFIG_PCI=y
CONFIG_PCI_MSI=y

# virtio-mmio support (required for Firecracker - uses MMIO not PCI)
# Both must be explicitly enabled; olddefconfig may disable VIRTIO_MMIO otherwise
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y

# FUSE support for passthrough filesystem
CONFIG_FUSE_FS=y

# btrfs filesystem with POSIX ACL support (container tools need file ACLs)
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y

# Snapshot restore selectively destroys only sockets captured before cleanup.
# SOCK_DESTROY is required; a global conntrack flush can delete live DNAT flows.
CONFIG_INET_DIAG=y
CONFIG_INET_DIAG_DESTROY=y
CONFIG_PACKET=y
