# Pinned on top of the running kernel's config for the arm64 host kernel
# ([kernel_profiles.nested.arm64.host_kernel] config_fragment).
#
# Wireless extensions off. WEXT_CORE registers a netdev notifier that walks every network
# namespace under rtnl_mutex on every device event (wext_netdev_notifier_call ->
# wireless_nlevent_flush -> for_each_net), 3.3 to 3.6 ms of hold per VM namespace life with
# 2000 to 3000 namespaces alive (#2034). It is def_bool y on CFG80211_WEXT || WIRELESS_EXT,
# and the 7.3.3 Kconfig has two routes to it: CFG80211_WEXT selects WEXT_CORE, and IPW2100,
# IPW2200 and LIBIPW (drivers/net/wireless/intel/ipw2x00) each select WIRELESS_EXT. Ubuntu's
# config, which the running kernel's descends from, sets all four. LIBIPW has no prompt and
# only IPW2100 and IPW2200 select it, so turning those two off removes it. WIRELESS_EXT and
# WEXT_CORE have no prompt either: their lines change nothing by themselves, and are here for
# the build's check after olddefconfig, which fails if a selector leaves either one set.
CONFIG_CFG80211_WEXT=n
CONFIG_IPW2100=n
CONFIG_IPW2200=n
CONFIG_WIRELESS_EXT=n
CONFIG_WEXT_CORE=n
