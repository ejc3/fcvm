# Pinned on top of the running kernel's config for the x86 host kernel
# ([kernel_profiles.nested.amd64.host_kernel] config_fragment).
#
# ENA (the EC2 NIC) built in: the host boots without an initramfs, and as a module ENA
# probed after cloud-init-local had looked for a NIC, so the host came up without its
# user data and the fleet agent never started (ejc3/aws#823, generation twelve).
CONFIG_ENA_ETHERNET=y
