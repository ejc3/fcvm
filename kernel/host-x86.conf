# Pinned on top of the running kernel's config for the x86 host kernel
# ([kernel_profiles.nested.amd64.host_kernel] config_fragment).
#
# ENA (the EC2 NIC) built in: the host boots without an initramfs, and as a module ENA
# probed after cloud-init-local had looked for a NIC, so the host came up without its
# user data and the fleet agent never started (ejc3/aws#823, generation twelve).
CONFIG_ENA_ETHERNET=y

# Wireless extensions off. CONFIG_CFG80211_WEXT selects WEXT_CORE, which registers a netdev
# notifier that walks every network namespace under rtnl_mutex on every device event
# (wext_netdev_notifier_call -> wireless_nlevent_flush -> for_each_net), 3.3 to 3.6 ms of
# hold per VM namespace life with 2000 to 3000 namespaces alive (#2034). WEXT_CORE is
# def_bool, so the build's check after olddefconfig is what fails if something selects it again.
CONFIG_CFG80211_WEXT=n
CONFIG_WIRELESS_EXT=n
CONFIG_WEXT_CORE=n
